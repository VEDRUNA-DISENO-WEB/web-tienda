<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clothing Store</title>
    <link rel="icon" href="./resources/img/logo_marca.png" type="image/png">
    <link rel="stylesheet" type="text/css" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div class="log">
        <div class="titulo">
            <img src="./resources/img/logo_marca.png" alt="Img Logo Marca">
            <h1>Welcome Back</h1>
        </div>
        <form class="form" action="./pages/seleccion/seleccion.html">
            <div class="inputs">
                <input type="text" placeholder="Username" required>
                <input type="password" placeholder="Password" required>
            </div>
            <div class="boton">
                <button class="login">Login</button>
                <button class="login_google">
                    <img src="./resources/img/google.png" alt="Google Icon">
                    Login with Google</button>
            </div>
        </form>
        
    </div>
    <div class="img">
        <img src="./resources/img/img_login.png" alt="Img Clothing Store">
    </div>
</body>
</html>
